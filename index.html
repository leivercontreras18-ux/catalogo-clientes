<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lewin Boutique - Catálogo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #faf7f5;
      color: #2c2c2c;
      padding: 20px;
    }
    header {
      text-align: center;
      padding: 30px 20px;
      background: white;
      border-radius: 20px;
      margin-bottom: 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    .logo-header {
      display: block;
      margin: 0 auto 20px auto;
      width: 140px;
      height: auto;
    }
    h1 {
      font-size: 2.2em;
      font-weight: 300;
      letter-spacing: 3px;
      color: #1a1a1a;
    }
    .subtitulo {
      color: #999;
      margin-top: 8px;
      font-size: 0.95em;
      letter-spacing: 1px;
    }
    .buscador {
      width: 100%;
      max-width: 500px;
      margin: 20px auto 0;
      display: block;
      padding: 14px 20px;
      border: 1px solid #e5e5e5;
      border-radius: 30px;
      font-size: 1em;
      outline: none;
      transition: 0.3s;
    }
    .buscador:focus { border-color: #c9a87c; }
    .filtros {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .filtro-btn {
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid #e5e5e5;
      background: white;
      color: #666;
      font-size: 0.9em;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .filtro-btn:hover {
      border-color: #c9a87c;
      color: #c9a87c;
    }
    .filtro-btn.activo {
      background: #c9a87c;
      color: white;
      border-color: #c9a87c;
      font-weight: 600;
    }

    #productos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .tarjeta {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .tarjeta:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    .foto {
      width: 100%;
      height: 260px;
      background: linear-gradient(135deg, #f5ede3 0%, #e8dcc9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c9a87c;
      font-size: 3em;
      overflow: hidden;
    }
    .foto img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .info { padding: 16px; }
    .info h3 {
      font-size: 1.05em;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .detalles {
      color: #888;
      font-size: 0.85em;
      margin-bottom: 10px;
    }
    .precio {
      font-size: 1.3em;
      font-weight: 600;
      color: #c9a87c;
      margin-bottom: 10px;
    }
    .estado {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8em;
      font-weight: 500;
    }
    .disponible { background: #e8f5e9; color: #2e7d32; }
    .agotado { background: #ffebee; color: #c62828; }
    .fav { float: right; font-size: 1.1em; }
        /* ===== CARRITO ===== */
    .cart-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      background: #c9a87c;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 12px 20px;
      font-size: 1em;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(201, 168, 124, 0.4);
      font-family: inherit;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cart-count {
      background: white;
      color: #c9a87c;
      border-radius: 50%;
      padding: 2px 8px;
      font-size: 0.85em;
      font-weight: 700;
      min-width: 22px;
      text-align: center;
    }
    .cart-panel {
      position: fixed;
      top: 0;
      right: -420px;
      width: 400px;
      max-width: 90vw;
      height: 100vh;
      background: white;
      box-shadow: -4px 0 30px rgba(0,0,0,0.15);
      z-index: 1001;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .cart-panel.open { right: 0; }
    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid #eee;
    }
    .cart-header h2 { font-size: 1.2em; font-weight: 500; }
    .cart-close {
      background: none;
      border: none;
      font-size: 1.5em;
      cursor: pointer;
      color: #999;
    }
    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 15px 20px;
    }
    .cart-empty {
      text-align: center;
      padding: 60px 20px;
      color: #999;
      line-height: 1.8;
    }
    .cart-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .cart-item-foto {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      background: #f5ede3;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5em;
    }
    .cart-item-foto img { width: 100%; height: 100%; object-fit: cover; }
    .cart-item-info { flex: 1; }
    .cart-item-nombre { font-weight: 500; font-size: 0.95em; margin-bottom: 4px; }
    .cart-item-detalles { font-size: 0.8em; color: #999; }
    .cart-item-precio { color: #c9a87c; font-weight: 600; font-size: 0.95em; }
    .cart-item-remove {
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      font-size: 1.2em;
      padding: 0 5px;
    }
    .cart-item-remove:hover { color: #e74c3c; }
    .cart-btn-cantidad {
      border: 1px solid #ddd;
      background: white;
      border-radius: 5px;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-size: 1em;
      line-height: 1;
    }
    .cart-footer {
      padding: 20px;
      border-top: 2px solid #f0f0f0;
      background: white;
    }
    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.3em;
      font-weight: 700;
      margin-bottom: 15px;
    }
    .cart-total span:last-child { color: #c9a87c; }
    .cart-send {
      width: 100%;
      padding: 15px;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    .cart-send:hover { background: #1ebe5d; }
    .cart-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .cart-overlay.open { opacity: 1; pointer-events: auto; }
    .btn-agregar {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #c9a87c;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9em;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-agregar:hover { background: #b8976a; }
    .btn-agregar:disabled { background: #ddd; cursor: not-allowed; }
    .cargando {
      text-align: center;
      padding: 60px;
      color: #999;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
<header>
  <img src="https://qhihqujbzjcuxshndsez.supabase.co/storage/v1/object/public/productos-fotos/1787708461873-removebg-preview.png" alt="Lewin Boutique" class="logo-header" />
  <h1>LEWIN BOUTIQUE</h1>
  <p class="subtitulo">Catálogo de productos</p>
  <input type="text" class="buscador" id="buscador" placeholder="🔍 Buscar producto..." />
  <div class="filtros" id="filtros">
  <!-- Los botones se generan automáticamente -->
  </div>
</header>

  <div id="productos">
    <p class="cargando">Cargando productos...</p>
  </div>

  <script type="module">
    const SUPABASE_URL = 'https://qhihqujbzjcuxshndsez.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoaWhxdWpiempjdXhzaG5kc2V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NzQzNTcsImV4cCI6MjEwMzM1MDM1N30.eyGr5EOeQQeYfftReayfRdMisR_cQIGPuLpiv7XFzhI';

    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    let todosLosProductos = [];
    let categoriaActual = 'Todas';

    async function cargarProductos() {
      const contenedor = document.getElementById('productos');
      try {
        const { data, error } = await supabase
          .from('inventario')
          .select('producto, categoria, talla, color, cantidad, precio_venta, foto_url, favorito');

        if (error) throw error;

        todosLosProductos = data || [];
        crearBotonesFiltros();
        mostrarProductos(todosLosProductos);
      } catch (err) {
        contenedor.innerHTML = '<p class="cargando">Error al cargar productos.</p>';
        console.error(err);
      }
    }
      window.crearBotonesFiltros = function crearBotonesFiltros() {
      const contenedor = document.getElementById('filtros');
      const categorias = ['Todas'];
      
      // Obtener categorías únicas de los productos
      const catsUnicas = [...new Set(todosLosProductos.map(p => p.categoria).filter(c => c))];
      catsUnicas.sort();
      
      categorias.push(...catsUnicas);
      
      contenedor.innerHTML = categorias.map(cat => `
        <button class="filtro-btn ${cat === categoriaActual ? 'activo' : ''}" 
                onclick="cambiarFiltro('${cat}')">
          ${cat}
        </button>
      `).join('');
    };

      window.cambiarFiltro = function cambiarFiltro(cat) {
      categoriaActual = cat;
      crearBotonesFiltros();
      
      // Reaplicar el buscador actual
      const texto = document.getElementById('buscador').value.toLowerCase();
      const filtrados = todosLosProductos.filter(p =>
        (p.producto || '').toLowerCase().includes(texto) ||
        (p.categoria || '').toLowerCase().includes(texto)
      );
      mostrarProductos(filtrados);
    }

    function mostrarProductos(lista) {
          // Filtrar por categoría seleccionada
          if (categoriaActual !== 'Todas') {
            lista = lista.filter(p => p.categoria === categoriaActual);
          }
      
          const contenedor = document.getElementById('productos');

      if (lista.length === 0) {
        contenedor.innerHTML = '<p class="cargando">No hay productos disponibles.</p>';
        return;
      }

      contenedor.innerHTML = lista.map(p => {
        const disponible = p.cantidad > 0;
        const tieneFoto = p.foto_url && p.foto_url.trim() !== '';

        // Si tiene foto, la muestra. Si no, muestra un ícono de ropa.
        const contenidoFoto = tieneFoto
          ? `<img src="${p.foto_url}" alt="${p.producto}" onerror="this.parentElement.innerHTML='👗'" />`
          : '👗';

        return `
          <div class="tarjeta">
            <div class="foto">${contenidoFoto}</div>
            <div class="info">
              ${p.favorito ? '<span class="fav">⭐</span>' : ''}
              <h3>${p.producto || 'Sin nombre'}</h3>
              <p class="detalles">
                ${p.categoria || ''}${p.talla ? ' · Talla ' + p.talla : ''}${p.color ? ' · ' + p.color : ''}
              </p>
              <p class="precio">$${p.precio_venta || 0}</p>
              <span class="estado ${disponible ? 'disponible' : 'agotado'}">
                ${disponible ? 'Disponible' : 'Agotado'}
              </span>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('buscador').addEventListener('input', (e) => {
      const texto = e.target.value.toLowerCase();
      const filtrados = todosLosProductos.filter(p =>
        (p.producto || '').toLowerCase().includes(texto) ||
        (p.categoria || '').toLowerCase().includes(texto)
      );
      mostrarProductos(filtrados);
    });

    cargarProductos();
  </script>
</body>
</html>
